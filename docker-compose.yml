# Jenkins local en Docker (guía "Pasos para levantar contenedor de Jenkins localmente").
#
#   docker compose up -d          -> Jenkins en http://localhost:8080
#   docker logs jenkins           -> contraseña inicial ("Please use the following password")
#   docker exec -it jenkins bash  -> entrar al contenedor (instalar docker.io si "docker ps" falla)
#
# El job usa "Pipeline script from SCM" y clona el repositorio desde GitHub, por eso no se monta
# la carpeta del proyecto: Jenkins trabaja sobre su propia copia en el volumen jenkins_home.
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins          # el Jenkinsfile usa este nombre en --volumes-from
    user: root                       # permite instalar python3-venv y docker.io dentro del contenedor
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home: {}
