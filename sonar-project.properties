# Configuración del análisis de SonarCloud. La usan el workflow de GitHub Actions
# (.github/workflows/ci.yml) y la etapa "SonarCloud" del Jenkinsfile.
# Reemplace los dos valores marcados con los de su proyecto en https://sonarcloud.io
sonar.organization=REEMPLAZAR_CON_SU_ORGANIZACION
sonar.projectKey=REEMPLAZAR_CON_SU_ORGANIZACION_mlops_repo_DCV
sonar.projectName=mlops_repo_DCV
sonar.projectVersion=1.0

sonar.sources=mlops_pipeline
sonar.inclusions=**/*.py
sonar.exclusions=**/test_*.py,**/__pycache__/**
sonar.tests=mlops_pipeline
sonar.test.inclusions=**/test_*.py
sonar.sourceEncoding=UTF-8

sonar.python.version=3.12
# Reportes generados por: pytest mlops_pipeline --cov=mlops_pipeline --cov-report=xml --junitxml=resultados_pruebas.xml
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=resultados_pruebas.xml
